{% extends "rest_framework/base.html" %}

{% block title %}{% if name %}{{ name }} · {% endif %}FitLife API{% endblock %}

{% block style %}
{{ block.super }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background: #f6f8fc; color: #172033; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .navbar { background: #172554 !important; border: 0; box-shadow: 0 4px 18px rgba(23, 37, 84, .16); }
    .navbar-brand, .navbar a { color: #fff !important; }
    .well, .form-control, textarea, select, input { border-radius: .6rem; }
    .well, .request-info, .response-info { background: #fff; border: 0; border-radius: 1rem; box-shadow: 0 .25rem 1rem rgba(23, 37, 84, .08); }
    .btn-primary, input[type="submit"] { background: #2563eb; border-color: #2563eb; border-radius: .6rem; font-weight: 700; }
    pre { border-radius: .75rem; }
</style>
{% endblock %}

{% block branding %}
<a class="navbar-brand fw-bold" href="/">FitLife API</a>
{% endblock %}

{% block script %}
{{ block.super }}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ title }} | FitLife{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-12 col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 fw-bold">{{ title }}</h1><p class="text-muted">¿Confirmas que deseas eliminar <strong>{{ object }}</strong>?</p><form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Sí, eliminar</button><a class="btn btn-outline-secondary" href="{% url back_url %}">Cancelar</a></form></div></div></div></div>{% endblock %}
